# /etc/nginx/sites-available/agradex.com  —  THE deployed vhost (apex + www + app host).
#
# Install:  sudo cp /opt/bagbanai/deploy/nginx-agradex.conf /etc/nginx/sites-available/agradex.com
#           sudo nginx -t && sudo systemctl reload nginx
# TLS:      sudo certbot --nginx -d agradex.com -d www.agradex.com -d app.agradex.com
#
# ⚠️ THIS FILE IS THE DISASTER-RECOVERY COPY, AND IT HAD DRIFTED (rewritten 2026-10-10).
# The Contabo migration hand-wrote a new, shorter vhost on the server and nobody carried it back
# here. The two had drifted in BOTH directions, which is the dangerous shape:
#   · the repo copy declared only `agradex.com www.agradex.com` — restoring nginx from it would
#     have left app.agradex.com unserved, i.e. the entire application down, on the one day anyone
#     ever reads this file;
#   · the live copy had lost the Cloudflare real-IP block, the tile cache header and http2, all of
#     which are below with the reasoning that earned them.
# Keep them equal. `sudo diff /etc/nginx/sites-available/agradex.com deploy/nginx-agradex.conf`.
#
# Hosts, and why one file serves all three: apex = marketing, app.agradex.com = the application
# (panel split, 2026-07-25), www = apex. Next.js decides which it is from the Host header
# (middleware → `x-app-host`), so nginx does not need to route by name — one upstream, one block.

# ─── HISTORY OF THIS FILE, because it has been wrong in both directions ─────────────────────
# The Contabo migration hand-wrote a new vhost on the server and nobody carried it back here, so
# the repo copy and the server copy each held things the other lacked. Closed in two steps:
#   2026-10-11 — the Cloudflare real-IP block (a security property; see the long comment below).
#   2026-10-11 — the tile Cache-Control header, http2, and a www → apex redirect at the origin.
# `sudo diff /etc/nginx/sites-available/agradex.com /opt/bagbanai/deploy/nginx-agradex.conf`
# should print nothing. If it prints something, one of the two drifted again.
# ─────────────────────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# ─────────────────────────────────────────────────────────────────────────────────────────────
# CLOUDFLARE REAL-IP. Without this the app sees $remote_addr = a Cloudflare edge address, and any
# header the client invents (CF-Connecting-IP, X-Forwarded-For, X-Real-IP) is forwarded upstream
# VERBATIM — so the per-IP rate limit on the unauthenticated magic-link endpoint costs one
# rotating header to defeat. `real_ip_header` makes nginx REWRITE $remote_addr from
# CF-Connecting-IP, and only for connections that actually came from a Cloudflare range; a direct
# hit on the origin keeps its true peer address instead of the header it sent.
#
# This matters more since migration 0064: public.auth_events stores `ip` for every sign-in and
# failed sign-in. Without the block below that column records whatever the caller typed into a
# header — an audit log of attacker-chosen strings.
#
# ⚠️ app.agradex.com is NOT CF-proxied (its A record points straight at the origin), which is
# exactly why the `proxy_set_header CF-Connecting-IP $remote_addr` lines further down are not
# redundant: they overwrite any client-supplied value with the address nginx resolved, so the
# limiter and the audit read one trustworthy field on both hosts.
#
# Ranges: https://www.cloudflare.com/ips/ — refresh if Cloudflare publishes new blocks.
# ─────────────────────────────────────────────────────────────────────────────────────────────
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# www → apex. See the note above: Cloudflare already does this for proxied traffic; this is the
# origin agreeing with it rather than serving the whole site under a second hostname.
#
# ⚠️ `www.agradex.com` MUST NOT also appear in the main blocks below. Two blocks listing the same
# literal name on the same listen address is a conflict, not a precedence: nginx keeps the first
# and drops the second with `conflicting server name ... ignored`, so the redirect would simply
# never run. (Exact-beats-wildcard is a real rule; exact-beats-exact is not.) An isolated
# `nginx -t` caught exactly this on 2026-10-11 before the live file was touched — and it is very
# likely the same mistake behind the "leftover duplicate block" warning the old Hetzner box had.
server {
    listen 80;
    listen [::]:80;
    server_name www.agradex.com;
    return 301 https://agradex.com$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.agradex.com;
    ssl_certificate     /etc/letsencrypt/live/agradex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agradex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://agradex.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name agradex.com app.agradex.com;   # www has its own block above
    client_max_body_size 15m;   # photo uploads (the backend caps at 12MB)

    # NO forced redirect to https, deliberately. This dates from Cloudflare SSL mode "Flexible",
    # where CF spoke http to the origin and a 301 here was an infinite loop. CF is on Full
    # (Strict) now, so a redirect would be safe — it is simply not worth the change, since
    # Cloudflare already serves the apex over https and nothing reaches :80 through it.

    location /titiler/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        # TiTiler sends its own `Cache-Control: public, max-age=3600`, and add_header APPENDS
        # rather than replaces — leaving two Cache-Control headers on one response, which is
        # ambiguous and in practice resolves to the shorter one. Hide theirs, send ours.
        # (Measured 2026-10-11: both headers really did arrive on a 200 tile.)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    # http2 on the LISTEN LINE, not the `http2 on;` directive: this box runs nginx 1.24.0 and
    # that directive arrived in 1.25.1, where it fails `nginx -t` with "unknown directive". After
    # an upgrade past 1.25.1 this form starts warning as deprecated — move it then, not before.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agradex.com app.agradex.com;   # www has its own block above

    ssl_certificate     /etc/letsencrypt/live/agradex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agradex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15m;

    # TiTiler → clipped index-COG raster tiles (§10.5). The trailing slash strips the prefix.
    # The cache header is not a nicety: a tile URL names a scene id and a fixed set of render
    # parameters, so its bytes can never change. Without it the browser refetches every tile on
    # every pan of the same date and TiTiler re-reads the COG each time. The weekly digest's
    # preview.png rides the same location, so Gmail's image proxy caches it too.
    location /titiler/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        # TiTiler sends its own `Cache-Control: public, max-age=3600`, and add_header APPENDS
        # rather than replaces — leaving two Cache-Control headers on one response, which is
        # ambiguous and in practice resolves to the shorter one. Hide theirs, send ours.
        # (Measured 2026-10-11: both headers really did arrive on a 200 tile.)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    # API → FastAPI (same-origin, so the auth cookie works without CORS)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
