# Rotation for the cron logs this repo's scripts write (/var/log/bagban-*.log).
#
# Install on the server (it is NOT picked up from the repo):
#     sudo cp /opt/bagbanai/deploy/logrotate-bagban.conf /etc/logrotate.d/bagban
#     sudo chmod 644 /etc/logrotate.d/bagban
#     sudo logrotate --debug /etc/logrotate.d/bagban    # dry run, prints what it would do
#
# WHY IT LIVES IN THE REPO. /root/bin/backup-db.sh is the cautionary tale: it runs nightly, it is
# the only thing standing between us and data loss, and it exists on exactly one machine — if that
# machine goes, the script goes with it. Anything the server needs and nobody could rewrite from
# memory belongs here, even when the file itself is installed by hand.
#
# Measured 2026-10-10: thirteen cron jobs had been appending since the Contabo migration with no
# rotation at all — 27 MB total, 16 MB of it bagban-hls.log, which is also the log that spent
# forty days writing "21/21 field(s) OK." over a pipeline that wrote nothing. A log nobody can
# `tail` without paging through a year of history is a log nobody reads.

/var/log/bagban-*.log {
    weekly
    # ...but sooner if one gets large on its own. The HLS and S2 runs print per-granule detail for
    # every field, so their volume tracks the field count, not the calendar.
    maxsize 20M
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    # The writers are plain `>>` redirections from crontab, and a run can outlive the rotation
    # window (run-hls.sh walks every field serially). With `create` the running job would keep
    # writing into the renamed inode and that night's output would vanish; copytruncate keeps the
    # same file open and risks only the few bytes in flight at the instant of the copy.
    copytruncate
    su root root
}
