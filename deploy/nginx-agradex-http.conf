# HTTP-only origin vhost for agradex.com — TLS is terminated at the Cloudflare edge
# (proxied A records). Origin listens on :80 only; app ports stay bound to 127.0.0.1.
# For end-to-end encryption later, switch to nginx-agradex.conf + a Cloudflare Origin
# Certificate (Full/strict).
server {
    listen 80;
    listen [::]:80;
    server_name agradex.com www.agradex.com;

    client_max_body_size 15m;   # photo uploads (backend caps at 12MB)

    # CLOUDFLARE REAL-IP. Without this the app sees $remote_addr = a Cloudflare edge address, and
    # any header the client invents (CF-Connecting-IP, X-Forwarded-For, X-Real-IP) is forwarded to
    # the upstream VERBATIM — so the per-IP rate limit on the unauthenticated magic-link endpoint
    # cost one rotating header to defeat. real_ip_header makes nginx REWRITE $remote_addr from
    # CF-Connecting-IP, and only for connections that actually came from a Cloudflare range; a
    # direct hit on the origin keeps its true peer address instead of the header it sent.
    # Ranges: https://www.cloudflare.com/ips/ — refresh if Cloudflare publishes new blocks.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
